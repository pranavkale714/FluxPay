spring:
  application:
    name: FluxPay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/FluxPayDB}
    username: ${DB_USERNAME:pbtb-02}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect